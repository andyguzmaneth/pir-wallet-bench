[package]
name = "pir-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Concurrent load test for an inspire-gpu-serving PIR endpoint"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
pir-client = { path = "../vendor/inspire-gpu-serving/crates/client" }
rand = "0.8"
serde_json = "1"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
